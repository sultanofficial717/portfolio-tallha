<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1012" />
      <stop offset="100%" stop-color="#141c22" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)" rx="16"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#25353d" stroke-width="2" rx="12"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="720" height="50" fill="#111c22" rx="8"/>
  <circle cx="65" cy="65" r="6" fill="#ff5f56"/>
  <circle cx="85" cy="65" r="6" fill="#ffbd2e"/>
  <circle cx="105" cy="65" r="6" fill="#27c93f"/>
  <text x="135" y="70" fill="#7ba2b5" font-family="'JetBrains Mono', monospace" font-size="14">autismlens_multimodal_rag_pipeline.py · Bahria FYP-I</text>
  
  <!-- Pipeline Diagram -->
  <g transform="translate(50, 120)">
    <!-- Stage 1: Ingestion -->
    <rect x="10" y="40" width="120" height="180" rx="8" fill="#16252d" stroke="#2b4754" stroke-width="1.5"/>
    <text x="70" y="75" fill="#00D4F0" font-family="'Anton', sans-serif" font-size="16" text-anchor="middle">L1 INGEST</text>
    <text x="70" y="110" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Clinical Forms</text>
    <text x="70" y="135" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">PDF / Scans</text>
    <text x="70" y="160" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Mobile Photos</text>
    <text x="70" y="195" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Multimodal</text>

    <!-- Arrow -->
    <path d="M135 130 L 165 130" stroke="#00F050" stroke-width="2.5"/>
    
    <!-- Stage 2: CV / OCR -->
    <rect x="170" y="40" width="120" height="180" rx="8" fill="#16252d" stroke="#2b4754" stroke-width="1.5"/>
    <text x="230" y="75" fill="#00D4F0" font-family="'Anton', sans-serif" font-size="16" text-anchor="middle">L2 VISION</text>
    <text x="230" y="110" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">OpenCV Mark</text>
    <text x="230" y="135" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Tesseract OCR</text>
    <text x="230" y="160" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Vectorization</text>
    <text x="230" y="195" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Score Vectors</text>

    <!-- Arrow -->
    <path d="M295 130 L 325 130" stroke="#00F050" stroke-width="2.5"/>
    
    <!-- Stage 3: Vector Knowledge -->
    <rect x="330" y="40" width="125" height="180" rx="8" fill="#192b34" stroke="#00D4F0" stroke-width="2"/>
    <text x="392" y="75" fill="#00D4F0" font-family="'Anton', sans-serif" font-size="16" text-anchor="middle">L3 GROUNDING</text>
    <text x="392" y="110" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">ChromaDB</text>
    <text x="392" y="135" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Sentence-BERT</text>
    <text x="392" y="160" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">DSM-5 Manual</text>
    <text x="392" y="195" fill="#00D4F0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Zero-Hallucination</text>

    <!-- Arrow -->
    <path d="M460 130 L 490 130" stroke="#00D4F0" stroke-width="2.5"/>
    
    <!-- Stage 4: LLM Reasoner -->
    <rect x="495" y="40" width="120" height="180" rx="8" fill="#182e25" stroke="#00F050" stroke-width="2"/>
    <text x="555" y="75" fill="#00F050" font-family="'Anton', sans-serif" font-size="16" text-anchor="middle">L4 REASONING</text>
    <text x="555" y="110" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Strict Citations</text>
    <text x="555" y="135" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Clinical Ground</text>
    <text x="555" y="160" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Score Synthesizer</text>
    <text x="555" y="195" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Medical LLM</text>

    <!-- Arrow -->
    <path d="M620 130 L 650 130" stroke="#00F050" stroke-width="2.5"/>
    
    <!-- Stage 5: Report -->
    <rect x="655" y="40" width="110" height="180" rx="8" fill="#16252d" stroke="#2b4754" stroke-width="1.5"/>
    <text x="710" y="75" fill="#00D4F0" font-family="'Anton', sans-serif" font-size="16" text-anchor="middle">L5 REPORT</text>
    <text x="710" y="110" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Clinical PDF</text>
    <text x="710" y="135" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Confidence</text>
    <text x="710" y="160" fill="#cfd9df" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Explainability</text>
    <text x="710" y="195" fill="#00D4F0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Structured</text>
  </g>
  
  <!-- Footer Metrics -->
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="680" height="110" rx="10" fill="#111c22" stroke="#25353d" stroke-width="1.5"/>
    <text x="30" y="40" fill="#7ba2b5" font-family="'JetBrains Mono', monospace" font-size="12">SUPERVISOR &amp; INSTITUTION</text>
    <text x="30" y="72" fill="#ffffff" font-family="'Anton', sans-serif" font-size="20">DR. FARYAL NOSHEEN · BAHRIA UNIVERSITY ISLAMABAD</text>
    <text x="30" y="95" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="12">Team: Talha Rehman (Lead) &amp; Abdul Rehman · Final Year Project I</text>
  </g>
