<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#181c24" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="16"/>
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#252b36" stroke-width="2" rx="12"/>
  
  <!-- Header Bar -->
  <rect x="40" y="40" width="720" height="50" fill="#131720" rx="8"/>
  <circle cx="65" cy="65" r="6" fill="#ff5f56"/>
  <circle cx="85" cy="65" r="6" fill="#ffbd2e"/>
  <circle cx="105" cy="65" r="6" fill="#27c93f"/>
  <text x="135" y="70" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="14">dspd_scheme_benchmark.py · Elsevier Major Revision</text>
  
  <!-- Central Architecture Diagram -->
  <g transform="translate(60, 130)">
    <!-- Hardware Node -->
    <rect x="20" y="80" width="180" height="120" rx="10" fill="#1b202c" stroke="#333e52" stroke-width="2"/>
    <text x="110" y="125" fill="#00F050" font-family="'Anton', sans-serif" font-size="20" text-anchor="middle">DEVICE SECRETS</text>
    <text x="110" y="155" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Hardware Salt + CPU UUID</text>
    
    <!-- Arrow 1 -->
    <path d="M205 140 L 255 140" stroke="#00F050" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="260,140 250,135 250,145" fill="#00F050"/>
    
    <!-- Core KDF Node -->
    <rect x="265" y="40" width="200" height="200" rx="12" fill="#15241e" stroke="#00F050" stroke-width="2.5"/>
    <text x="365" y="90" fill="#ffffff" font-family="'Anton', sans-serif" font-size="24" text-anchor="middle">ARGON2id</text>
    <text x="365" y="125" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">Memory-Hard KDF</text>
    <line x1="285" y1="145" x2="445" y2="145" stroke="#25543c" stroke-width="1.5"/>
    <text x="365" y="175" fill="#ffffff" font-family="'Anton', sans-serif" font-size="22" text-anchor="middle">HKDF-SHA256</text>
    <text x="365" y="205" fill="#00D4F0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Domain Separation Fixed</text>
    
    <!-- Arrow 2 -->
    <path d="M470 140 L 520 140" stroke="#00D4F0" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="525,140 515,135 515,145" fill="#00D4F0"/>
    
    <!-- Output Key Node -->
    <rect x="530" y="80" width="170" height="120" rx="10" fill="#192231" stroke="#00D4F0" stroke-width="2"/>
    <text x="615" y="125" fill="#00D4F0" font-family="'Anton', sans-serif" font-size="20" text-anchor="middle">STATELESS KEY</text>
    <text x="615" y="155" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle">Zero-Storage Derived</text>
  </g>
  
  <!-- Footer Metrics -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="680" height="100" rx="10" fill="#131720" stroke="#252b36" stroke-width="1.5"/>
    <text x="30" y="40" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="12">VENUE &amp; STATUS</text>
    <text x="30" y="72" fill="#ffffff" font-family="'Anton', sans-serif" font-size="20">ELSEVIER MAJOR REVISION · RANDOM ORACLE MODEL</text>
    <text x="520" y="40" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="12">PACKAGE</text>
    <text x="520" y="72" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="16">pip install dspd</text>
  </g>
</svg>
