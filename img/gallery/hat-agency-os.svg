  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg-hat)" stroke="#1e4653" stroke-width="2"/>
  
  <circle cx="450" cy="180" r="160" fill="#06b6d4" opacity="0.12" filter="blur(40px)"/>

