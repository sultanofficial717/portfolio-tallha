    <rect x="485" y="25" width="210" height="100" rx="10" fill="#0d2128" stroke="#1b414f"/>
    <text x="500" y="60" fill="#00F050" font-family="'Anton', sans-serif" font-size="30">WHITELABEL</text>
    <text x="500" y="86" fill="#9cd2de" font-family="'Roboto Flex', sans-serif" font-size="13">Multi-Tenant Agency OS</text>
    <text x="500" y="106" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11">● Client Automation Suite</text>

    <rect x="25" y="145" width="670" height="100" rx="10" fill="#07151a" stroke="#15323d"/>
    <text x="45" y="178" fill="#ffffff" font-family="'Roboto Flex', sans-serif" font-size="14" font-weight="600">Agency Leadership &amp; Engineering:</text>
    <text x="45" y="202" fill="#b0dee8" font-family="'Roboto Flex', sans-serif" font-size="13">Formulated business acquisition strategy and built enterprise automation workflows for international clients.</text>
    <text x="45" y="226" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="12">Domain: Applied AI Software Agency · hattechnologies.tech</text>
