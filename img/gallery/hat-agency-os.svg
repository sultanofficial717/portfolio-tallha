    <text x="40" y="60" fill="#22d3ee" font-family="'Anton', sans-serif" font-size="30">LANGGRAPH</text>
    <text x="40" y="86" fill="#9cd2de" font-family="'Roboto Flex', sans-serif" font-size="13">Multi-Agent State Graph</text>
    <text x="40" y="106" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="11">● Stateful Workflow Engine</text>

    <rect x="255" y="25" width="210" height="100" rx="10" fill="#0d2128" stroke="#1b414f"/>
    <text x="270" y="60" fill="#ffffff" font-family="'Anton', sans-serif" font-size="30">TEMPORAL</text>
    <text x="270" y="86" fill="#9cd2de" font-family="'Roboto Flex', sans-serif" font-size="13">Durable Execution Core</text>
