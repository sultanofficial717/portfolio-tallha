      <stop offset="50%" stop-color="#0f2229"/>
      <stop offset="100%" stop-color="#050d10"/>
    </linearGradient>
    <linearGradient id="card-hat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15313a" stop-opacity="0.9"/>
