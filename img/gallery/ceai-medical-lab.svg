    <text x="40" y="106" fill="#00F050" font-family="'JetBrains Mono', monospace" font-size="11">● Medical Imaging QC</text>

    <rect x="255" y="25" width="210" height="100" rx="10" fill="#241220" stroke="#4a2540"/>
